<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:replace="~{fragments :: navbar}"></div>

<div class="content">
    <h2 th:text="'Edit ' + ${module.title}"></h2>
    <a th:href="@{/m/{k}(k=${module.key})}">Back to list</a>

    <form th:action="@{/m/{k}/update(k=${module.key})}" method="post" class="addform">
        <div class="field" th:each="f : ${module.fields}">
            <label th:text="${f[1]}"></label>
            <select th:if="${#strings.startsWith(f[2], 'select:')}" th:name="${f[0]}">
                <option th:each="o : ${#strings.arraySplit(#strings.substringAfter(f[2], 'select:'), ',')}"
                        th:value="${o}" th:text="${o}" th:selected="${o == row[f[0]]}"></option>
            </select>
            <input th:unless="${#strings.startsWith(f[2], 'select:')}"
                   th:name="${f[0]}"
                   th:type="${f[2] == 'optional' ? 'text' : f[2]}"
                   th:value="${row[f[0]]}"
                   th:readonly="${f[0] == module.idField}"
                   th:required="${f[2] != 'optional'}">
        </div>
        <br>
        <button type="submit">Update</button>
    </form>
</div>
</body>
</html>
